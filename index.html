<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Clinic Timer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap"
        crossorigin="anonymous"
        referrerpolicy="no-referrer"
    >
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <!-- Unified SVG icon sprite (24x24 grid, consistent rounded geometry) -->
    <svg class="icon-sprite" aria-hidden="true" focusable="false">
        <defs>
            <symbol id="ct-icon-play" viewBox="0 0 24 24">
                <polygon
                    points="8 5.5 18.5 12 8 18.5 8 5.5"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linejoin="round"
                    stroke-linecap="round"
                ></polygon>
            </symbol>
            <symbol id="ct-icon-pause" viewBox="0 0 24 24">
                <rect x="6.5" y="4.5" width="4" height="15" rx="1.5" fill="currentColor"></rect>
                <rect x="13.5" y="4.5" width="4" height="15" rx="1.5" fill="currentColor"></rect>
            </symbol>
            <symbol id="ct-icon-reset" viewBox="0 0 24 24">
                <path
                    d="M3 12a9 9 0 1 0 3-6.7L3 8"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
                <path
                    d="M3 3v5h5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
            </symbol>
            <symbol id="ct-icon-trash" viewBox="0 0 24 24">
                <path
                    d="M3 6h18"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
                <path
                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
                <path
                    d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
                <line
                    x1="10"
                    y1="11"
                    x2="10"
                    y2="17"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                ></line>
                <line
                    x1="14"
                    y1="11"
                    x2="14"
                    y2="17"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                ></line>
            </symbol>
            <symbol id="ct-icon-plus" viewBox="0 0 24 24">
                <path
                    d="M12 5v14M5 12h14"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.25"
                    stroke-linecap="round"
                ></path>
            </symbol>
            <symbol id="ct-icon-reorder" viewBox="0 0 24 24">
                <path
                    d="m7 15 5 5 5-5M7 9l5-5 5 5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                ></path>
            </symbol>
            <symbol id="ct-icon-grip" viewBox="0 0 24 24">
                <circle cx="9" cy="6" r="1.5" fill="currentColor"></circle>
                <circle cx="15" cy="6" r="1.5" fill="currentColor"></circle>
                <circle cx="9" cy="12" r="1.5" fill="currentColor"></circle>
                <circle cx="15" cy="12" r="1.5" fill="currentColor"></circle>
                <circle cx="9" cy="18" r="1.5" fill="currentColor"></circle>
                <circle cx="15" cy="18" r="1.5" fill="currentColor"></circle>
            </symbol>
        </defs>
    </svg>

    <main class="timer-container">
        <header class="header">
            <button type="button" id="reset-all-btn" class="reset-all">
                Reset All
            </button>
            <button type="button" id="reorder-btn" class="reorder-button" aria-pressed="false">
                <svg class="icon icon-sm" width="16" height="16" aria-hidden="true" focusable="false">
                    <use href="#ct-icon-reorder"></use>
                </svg>
                <span>Reorder</span>
            </button>
            <button type="button" id="add-timer-btn" class="add-button" aria-label="Add new timer" title="Add new timer">
                <svg class="icon" width="22" height="22" aria-hidden="true" focusable="false">
                    <use href="#ct-icon-plus"></use>
                </svg>
            </button>
        </header>

        <section id="timer-list" class="timer-list" aria-label="Clinic visit timers"></section>
    </main>

    <!-- Native modal dialogs -->
    <dialog id="add-timer-dialog" class="modal-dialog" aria-labelledby="add-timer-title" closedby="any">
        <form id="add-timer-form" method="dialog" class="modal-content">
            <h2 id="add-timer-title" class="modal-title">New Timer</h2>
            <input
                id="timer-name-input"
                name="timerName"
                type="text"
                class="input"
                placeholder="Timer Name"
                aria-label="Timer Name"
                autocomplete="off"
                autofocus
            >
            <div class="button-group">
                <button type="button" id="add-timer-cancel-btn" class="button cancel">
                    Cancel
                </button>
                <button type="submit" value="confirm" class="button confirm">
                    Add
                </button>
            </div>
        </form>
    </dialog>

    <dialog id="reset-all-dialog" class="modal-dialog" aria-labelledby="reset-all-title" closedby="any">
        <form method="dialog" class="modal-content">
            <h2 id="reset-all-title" class="modal-title">Reset All Timers?</h2>
            <p class="modal-description">
                This will reset all active timers to zero. This action cannot be undone.
            </p>
            <div class="button-group">
                <button type="submit" value="cancel" class="button cancel" autofocus>
                    Cancel
                </button>
                <button type="submit" value="confirm" class="button delete">
                    Reset
                </button>
            </div>
        </form>
    </dialog>

    <dialog id="delete-timer-dialog" class="modal-dialog" aria-labelledby="delete-timer-title" closedby="any">
        <form method="dialog" class="modal-content">
            <h2 id="delete-timer-title" class="modal-title">Delete Timer?</h2>
            <p class="modal-description">
                This will permanently delete the timer. This action cannot be undone.
            </p>
            <div class="button-group">
                <button type="submit" value="cancel" class="button cancel" autofocus>
                    Cancel
                </button>
                <button type="submit" value="confirm" class="button delete">
                    Delete
                </button>
            </div>
        </form>
    </dialog>
</body>
</html>
